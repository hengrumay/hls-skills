<!doctype html>
<!--
  Vital Skills — hero animation preview (variant 4: abstract flowing lines + drifting particles).
  A minimal page for comparing against the combined-signals line on index.html; not linked from it.
  Same palette and type as index.html. Inline CSS + vanilla JS; the typefaces load from Google Fonts.
  Every local ref is relative so it works under /hls-skills/.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vital Skills Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
  :root {
    --lava: #FF3621;
    --navy: #1B3139;
    --page: #F9F7F4;
    --ink: #1B3139;
    --ink-soft: #4F636A;
    --line-2: #1B3139;
    --line-3: #B8AE9C;
    --focus: #1B3139;
    --sans: "DM Sans", "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0B2026; --ink: #F9F7F4; --ink-soft: #B3C0C4; --line-2: #D3DBDD; --line-3: #7F979E; --focus: #FF5F46;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #0B2026; --ink: #F9F7F4; --ink-soft: #B3C0C4; --line-2: #D3DBDD; --line-3: #7F979E; --focus: #FF5F46;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 400 1rem/1.55 var(--sans); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .bar { padding: 18px 0; font-size: .9rem; color: var(--ink-soft); }
  .bar a { color: var(--ink); text-decoration-color: var(--lava); text-underline-offset: 3px; }
  .hero { padding: 48px 0 64px; }
  .wordmark { font-weight: 700; font-size: clamp(2.8rem, 7.5vw, 5.2rem); line-height: .95; letter-spacing: -0.045em; margin: 0; }
  .flow { display: block; width: 100%; max-width: 760px; height: 96px; margin: 14px 0 18px; }
  .tagline { font-size: clamp(1.1rem, 2.4vw, 1.35rem); color: var(--ink-soft); max-width: 46ch; margin: 0; }
</style>
</head>
<body>
<div class="wrap bar"><a href="index.html">← Back to the full page</a></div>
<main class="wrap hero">
  <h1 class="wordmark">Vital Skills</h1>
  <canvas class="flow" id="flow" aria-hidden="true"></canvas>
  <p class="tagline">Genie Code skills for Health &amp; Life Sciences workflows.</p>
</main>
<script>
(() => {
  // Three slow, interleaved lines (lava leads; navy and oat-shade follow) with particles
  // drifting along them. Nothing here depicts a specific domain: it is just motion and flow.
  const canvas = document.getElementById("flow");
  const ctx = canvas.getContext("2d");
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  const LINES = [
    { color: "--lava",   width: 2.2, alpha: 1,   amp: .30, freq: 1.6, speed: .35, phase: 0 },
    { color: "--line-2", width: 1.4, alpha: .55, amp: .22, freq: 2.1, speed: .25, phase: 1.7 },
    { color: "--line-3", width: 1.4, alpha: .8,  amp: .26, freq: 1.2, speed: .18, phase: 3.1 },
  ];
  const PARTICLES = Array.from({ length: 26 }, (_, i) => ({
    line: i % LINES.length, x: Math.random(), v: .02 + Math.random() * .04, r: 1.2 + Math.random() * 1.6,
  }));

  let w = 0, h = 0;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  // y for line L at horizontal fraction u (0..1) and time t (seconds). Two summed sines keep it organic;
  // the envelope tapers both ends so the lines emerge from, and settle back into, the baseline.
  function y(L, u, t) {
    const env = Math.sin(Math.PI * u) ** 1.4;
    const a = Math.sin(u * Math.PI * 2 * L.freq + t * L.speed + L.phase);
    const b = Math.sin(u * Math.PI * 2 * L.freq * 2.3 - t * L.speed * .7 + L.phase * 1.3) * .35;
    return h / 2 + (a + b) * env * L.amp * h;
  }
  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    LINES.forEach(L => {
      ctx.beginPath();
      for (let x = 0; x <= w; x += 3) { const u = x / w; x ? ctx.lineTo(x, y(L, u, t)) : ctx.moveTo(x, y(L, u, t)); }
      ctx.strokeStyle = css(L.color); ctx.globalAlpha = L.alpha; ctx.lineWidth = L.width; ctx.lineCap = "round";
      ctx.stroke();
    });
    PARTICLES.forEach(p => {
      const L = LINES[p.line], u = p.x;
      ctx.globalAlpha = .35 + .65 * Math.sin(Math.PI * u);
      ctx.fillStyle = css(L.color);
      ctx.beginPath(); ctx.arc(u * w, y(L, u, t), p.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  let raf = 0, start = 0, last = 0;
  function loop(now) {
    if (!start) start = last = now;
    const dt = Math.min((now - last) / 1000, .05); last = now;
    PARTICLES.forEach(p => { p.x = (p.x + p.v * dt) % 1; });
    frame((now - start) / 1000);
    raf = requestAnimationFrame(loop);
  }
  // Reduced motion: one still frame, no loop.
  function run() {
    cancelAnimationFrame(raf); start = 0;
    resize();
    if (reduceMotion.matches) frame(2); else raf = requestAnimationFrame(loop);
  }
  reduceMotion.addEventListener("change", run);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => frame(2));
  addEventListener("resize", () => { resize(); if (reduceMotion.matches) frame(2); });
  run();
})();
</script>
</body>
</html>
